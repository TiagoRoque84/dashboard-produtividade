<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard — Sr. Tiago</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg1:#fff;--bg2:#f8f9fa;--bg3:#eef0f5;
  --t1:#1a1a1a;--t2:#6b7280;--t3:#9ca3af;
  --b1:rgba(0,0,0,0.09);--b2:rgba(0,0,0,0.18);
  --font:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'SF Mono','Fira Code','Courier New',monospace;
}
@media(prefers-color-scheme:dark){
  :root{--bg1:#1e1e2e;--bg2:#27273a;--bg3:#161622;--t1:#e2e8f0;--t2:#94a3b8;--t3:#64748b;--b1:rgba(255,255,255,0.07);--b2:rgba(255,255,255,0.15);}
}
body{background:var(--bg3);color:var(--t1);font-family:var(--font);min-height:100vh}
#root{max-width:1100px;margin:0 auto;padding:1.5rem}
input,select,textarea,button{font-family:var(--font);color:var(--t1)}
input[type=date],input[type=time]{color-scheme:light dark}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:var(--b2);border-radius:4px}
button{cursor:pointer}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef} = React;

/* ═══════════════════════════════════════════
   CONFIG — edite aqui
   ═══════════════════════════════════════════ */
const PASSWORD  = "tiago2026";   // ← mude a senha
const NOME      = "Sr. Tiago";   // ← mude o nome

/* ═══════════════════════════════════════════
   DADOS ESTÁTICOS
   ═══════════════════════════════════════════ */
const CATS = {
  "Grupo Transer":       {bg:"#e8e9f8",fg:"#2D2F85"},
  "Transer CGR":         {bg:"#e6f0ff",fg:"#1a4fa0"},
  "Transer Ambiental":   {bg:"#e6fef5",fg:"#0a7a55"},
  "Raddi Adubos":        {bg:"#eaf6e1",fg:"#2d7a1f"},
  "Transportadora Ézio": {bg:"#fff4e0",fg:"#b86800"},
  "UNIP":      {bg:"#fff0eb",fg:"#c94a1a"},
  "AlertaDoc": {bg:"#e0f2ff",fg:"#0369a1"},
  "MEI":       {bg:"#f3ebff",fg:"#6d3fcf"},
  "Pessoal":   {bg:"#fce8f3",fg:"#a0206b"},
};
const PRIOS = {
  "Inegociável":  {color:"#dc2626",bg:"#fee2e2",order:0},
  "Prioridade":   {color:"#ea580c",bg:"#ffedd5",order:1},
  "Importante":   {color:"#ca8a04",bg:"#fef9c3",order:2},
  "Não esquecer": {color:"#2563eb",bg:"#dbeafe",order:3},
  "Fazer":        {color:"#6b7280",bg:"#f3f4f6",order:4},
};
const HABITS=[
  {id:"exercicio",label:"Exercício",icon:"🏃"},
  {id:"agua",label:"Água 2,5 L",icon:"💧"},
  {id:"estudo",label:"Estudo",icon:"📖"},
  {id:"projeto",label:"Projeto pessoal",icon:"💻"},
  {id:"leitura",label:"Leitura",icon:"📚"},
];
const DAYS=["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
const MISSIONS=[
  "Executa. Missão primeiro, conforto depois.",
  "Disciplina é liberdade.",
  "O sistema falha. O hábito não.",
  "Foco. Consistência. Resultado.",
  "Cada tarefa concluída é uma batalha vencida.",
  "Acorde cedo. Trabalhe duro. Entregue.",
];

/* ═══════════════════════════════════════════
   UTILS
   ═══════════════════════════════════════════ */
const todayStr=()=>new Date().toISOString().split("T")[0];
const fmt=s=>`${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`;
const fmtDate=d=>{if(!d)return"";const[y,m,dd]=d.split("-");return`${dd}/${m}/${y}`;};
const ld=(k,fb)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):fb;}catch{return fb;}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch{}};
const initF=(date="")=>({text:"",cat:"Pessoal",priority:"Fazer",startDate:date,startTime:"",endDate:"",endTime:""});
const byPrio=arr=>[...arr].sort((a,b)=>(PRIOS[a.priority]?.order??4)-(PRIOS[b.priority]?.order??4));
const authGet=()=>{try{return sessionStorage.getItem("auth")==="1";}catch{return false;}};
const authSet=()=>{try{sessionStorage.setItem("auth","1");}catch{}};
const authClear=()=>{try{sessionStorage.removeItem("auth");}catch{}};

/* ═══════════════════════════════════════════
   LOGIN
   ═══════════════════════════════════════════ */
function Login({onLogin}){
  const [pw,setPw]=useState(""),[err,setErr]=useState(false),[shake,setShake]=useState(false);
  const submit=()=>{
    if(pw===PASSWORD){authSet();onLogin();}
    else{setErr(true);setShake(true);setTimeout(()=>{setErr(false);setShake(false);},700);}
  };
  return(
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center"}}>
      <div style={{background:"var(--bg1)",border:"0.5px solid var(--b1)",borderRadius:"20px",padding:"2.5rem 2rem",width:"340px",textAlign:"center",transform:shake?"translateX(6px)":"none",transition:"transform 0.1s"}}>
        <div style={{fontSize:"36px",marginBottom:"8px"}}>📋</div>
        <div style={{fontSize:"20px",fontWeight:"500",color:"var(--t1)",marginBottom:"4px"}}>Dashboard</div>
        <div style={{fontSize:"13px",color:"var(--t2)",marginBottom:"28px"}}>{NOME} — Produtividade</div>
        <input type="password" value={pw} onChange={e=>setPw(e.target.value)} onKeyDown={e=>e.key==="Enter"&&submit()}
          placeholder="Senha de acesso" autoFocus
          style={{width:"100%",padding:"10px 14px",fontSize:"14px",borderRadius:"10px",border:`1.5px solid ${err?"#dc2626":"var(--b2)"}`,background:"var(--bg2)",color:"var(--t1)",outline:"none",marginBottom:"12px",textAlign:"center",transition:"border-color 0.2s"}}/>
        <button onClick={submit}
          style={{width:"100%",padding:"11px",fontSize:"14px",fontWeight:"500",borderRadius:"10px",background:"#6366f1",color:"#fff",border:"none"}}>
          Entrar
        </button>
        {err&&<div style={{fontSize:"12px",color:"#dc2626",marginTop:"10px"}}>Senha incorreta. Tente novamente.</div>}
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════
   COMPONENTES COMPARTILHADOS
   ═══════════════════════════════════════════ */
const IS={fontSize:"12px",padding:"7px 9px",borderRadius:"8px",border:"0.5px solid var(--b2)",background:"var(--bg1)",color:"var(--t1)",outline:"none",width:"100%",boxSizing:"border-box"};

const Badge=({cat})=>(
  <span style={{fontSize:"10px",padding:"2px 7px",borderRadius:"20px",background:CATS[cat]?.bg||"#f0f0f0",color:CATS[cat]?.fg||"#555",fontWeight:"500",whiteSpace:"nowrap"}}>{cat}</span>
);
const PBadge=({prio})=>!prio?null:(
  <span style={{fontSize:"10px",padding:"2px 7px",borderRadius:"20px",background:PRIOS[prio]?.bg,color:PRIOS[prio]?.color,fontWeight:"500",whiteSpace:"nowrap"}}>{prio}</span>
);
const SCard=({title,accent="#6366f1",children,extra})=>(
  <div style={{background:"var(--bg1)",border:"0.5px solid var(--b1)",borderRadius:"16px",overflow:"hidden"}}>
    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"11px 16px",borderBottom:"0.5px solid var(--b1)",background:"var(--bg2)"}}>
      <div style={{display:"flex",alignItems:"center",gap:"8px"}}>
        <div style={{width:"3px",height:"16px",borderRadius:"2px",background:accent}}/>
        <span style={{fontWeight:"500",fontSize:"14px",color:"var(--t1)"}}>{title}</span>
      </div>
      {extra}
    </div>
    <div style={{padding:"14px 16px"}}>{children}</div>
  </div>
);
const Ring=({pct,size=56,stroke=5,color="#10B981"})=>{
  const r=(size-stroke)/2,c=2*Math.PI*r;
  return(
    <svg width={size} height={size}>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="var(--b1)" strokeWidth={stroke}/>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={color} strokeWidth={stroke}
        strokeDasharray={c} strokeDashoffset={c*(1-pct/100)} strokeLinecap="round"
        transform={`rotate(-90 ${size/2} ${size/2})`} style={{transition:"stroke-dashoffset 0.4s"}}/>
      <text x={size/2} y={size/2+5} textAnchor="middle" fontSize="12" fontWeight="500" fill="var(--t1)">{Math.round(pct)}%</text>
    </svg>
  );
};

/* ── Formulário de tarefa ── */
const TaskForm=({init,onSave,onCancel})=>{
  const [f,setF]=useState(init);
  const set=(k,v)=>setF(p=>({...p,[k]:v}));
  return(
    <div style={{background:"var(--bg2)",borderRadius:"12px",padding:"14px",border:"0.5px solid var(--b2)",marginBottom:"12px"}}>
      <input value={f.text} onChange={e=>set("text",e.target.value)} placeholder="Descrição da tarefa *" autoFocus
        style={{...IS,marginBottom:"8px",fontSize:"13px",padding:"8px 10px"}}/>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"6px",marginBottom:"8px"}}>
        <select value={f.cat} onChange={e=>set("cat",e.target.value)} style={IS}>
          {Object.keys(CATS).map(c=><option key={c}>{c}</option>)}
        </select>
        <select value={f.priority} onChange={e=>set("priority",e.target.value)}
          style={{...IS,background:PRIOS[f.priority]?.bg||"var(--bg1)",color:PRIOS[f.priority]?.color||"var(--t1)"}}>
          {Object.keys(PRIOS).map(p=><option key={p}>{p}</option>)}
        </select>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr",gap:"6px",marginBottom:"12px"}}>
        {[["Início data","startDate","date"],["Início hora","startTime","time"],["Término data","endDate","date"],["Término hora","endTime","time"]].map(([lbl,key,type])=>(
          <div key={key}>
            <div style={{fontSize:"10px",color:"var(--t2)",marginBottom:"3px"}}>{lbl} <span style={{opacity:0.6}}>(opc.)</span></div>
            <input type={type} value={f[key]} onChange={e=>set(key,e.target.value)} style={IS}/>
          </div>
        ))}
      </div>
      <div style={{display:"flex",gap:"8px",justifyContent:"flex-end"}}>
        <button onClick={onCancel} style={{padding:"6px 14px",fontSize:"12px",borderRadius:"8px",border:"0.5px solid var(--b2)",background:"transparent",color:"var(--t2)"}}>Cancelar</button>
        <button onClick={()=>f.text.trim()&&onSave(f)}
          style={{padding:"6px 18px",fontSize:"12px",fontWeight:"500",borderRadius:"8px",background:"#6366f1",color:"#fff",border:"none"}}>
          Salvar tarefa
        </button>
      </div>
    </div>
  );
};

/* ── Linha de tarefa ── */
const TaskRow=({task,onToggle,onEdit,onDelete})=>{
  const now=new Date();
  const endDt=task.endDate?new Date(`${task.endDate}T${task.endTime||"23:59"}`):null;
  const overdue=!task.done&&endDt&&endDt<now;
  const urgent=!task.done&&endDt&&!overdue&&(endDt-now)/60000<=120;
  return(
    <div style={{display:"flex",alignItems:"flex-start",gap:"10px",padding:"10px 12px",borderRadius:"10px",
      background:task.done?"var(--bg2)":"var(--bg1)",
      border:`0.5px solid ${overdue?"#dc2626":urgent?"#ea580c":"var(--b1)"}`,marginBottom:"5px",transition:"all 0.15s"}}>

      {/* CHECKBOX — clique para concluir */}
      <div title="Clique para marcar como concluída"
        onClick={()=>onToggle(task.id)}
        style={{
          width:"20px",height:"20px",flexShrink:0,borderRadius:"6px",cursor:"pointer",marginTop:"1px",
          border:`2px solid ${task.done?"#6366f1":"var(--b2)"}`,
          background:task.done?"#6366f1":"transparent",
          display:"flex",alignItems:"center",justifyContent:"center",
          transition:"all 0.15s",userSelect:"none",
        }}>
        {task.done&&<svg width="11" height="9" viewBox="0 0 11 9" fill="none"><path d="M1 4l3 3 6-6" stroke="#fff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>}
      </div>

      <div style={{flex:1,minWidth:0}}>
        <div style={{fontSize:"13px",color:task.done?"var(--t3)":"var(--t1)",textDecoration:task.done?"line-through":"none",lineHeight:"1.4",marginBottom:"5px"}}>{task.text}</div>
        <div style={{display:"flex",flexWrap:"wrap",gap:"4px",alignItems:"center"}}>
          <PBadge prio={task.priority}/>
          <Badge cat={task.cat}/>
          {task.startTime&&<span style={{fontSize:"10px",color:"var(--t2)"}}>Início {task.startTime}</span>}
          {task.endDate&&(
            <span style={{fontSize:"10px",fontWeight:overdue||urgent?"500":"400",color:overdue?"#dc2626":urgent?"#ea580c":"var(--t2)"}}>
              {overdue?"⚠ Venceu ":"Término "}{fmtDate(task.endDate)}{task.endTime?` ${task.endTime}`:""}
            </span>
          )}
        </div>
      </div>

      <div style={{display:"flex",gap:"4px",flexShrink:0,marginTop:"1px"}}>
        <button onClick={()=>onEdit(task)}
          style={{padding:"3px 9px",fontSize:"11px",borderRadius:"6px",border:"0.5px solid var(--b2)",background:"transparent",color:"var(--t2)"}}>
          Editar
        </button>
        <button onClick={()=>{ if(confirm("Excluir tarefa?")) onDelete(task.id); }}
          style={{padding:"3px 9px",fontSize:"11px",borderRadius:"6px",border:"none",background:"#fee2e2",color:"#dc2626"}}>
          Excluir
        </button>
      </div>
    </div>
  );
};

/* ── Linha compacta (Tarefas do dia) ── */
const TaskRowCompact=({task,onToggle,onEdit,onDelete})=>{
  const now=new Date();
  const endDt=task.endDate?new Date(`${task.endDate}T${task.endTime||"23:59"}`):null;
  const overdue=!task.done&&endDt&&endDt<now;
  const urgent=!task.done&&endDt&&!overdue&&(endDt-now)/60000<=120;
  return(
    <div style={{display:"flex",alignItems:"center",gap:"8px",padding:"7px 8px",borderRadius:"10px",
      background:task.done?"var(--bg2)":"var(--bg1)",
      border:`0.5px solid ${overdue?"#dc2626":urgent?"#ea580c":"var(--b1)"}`,marginBottom:"4px"}}>
      <div title="Clique para marcar como concluída" onClick={()=>onToggle(task.id)}
        style={{width:"18px",height:"18px",flexShrink:0,borderRadius:"5px",cursor:"pointer",
          border:`2px solid ${task.done?"#6366f1":"var(--b2)"}`,background:task.done?"#6366f1":"transparent",
          display:"flex",alignItems:"center",justifyContent:"center",transition:"all 0.15s",userSelect:"none"}}>
        {task.done&&<svg width="10" height="8" viewBox="0 0 10 8" fill="none"><path d="M1 4l3 3 5-6" stroke="#fff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>}
      </div>
      <span style={{flex:1,fontSize:"13px",color:task.done?"var(--t3)":"var(--t1)",textDecoration:task.done?"line-through":"none",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{task.text}</span>
      <PBadge prio={task.priority}/>
      <Badge cat={task.cat}/>
    </div>
  );
};

/* ═══════════════════════════════════════════
   APP PRINCIPAL
   ═══════════════════════════════════════════ */
function App(){
  const [now,setNow]=useState(new Date());
  const [mIdx,setMIdx]=useState(0);

  // Tasks — migra formato antigo se necessário
  const [tasks,setTasks]=useState(()=>{
    const t=ld("d:tasks2",null);
    if(!t){const old=ld("d:tasks",[]);return old.map(o=>({...o,startDate:o.startDate||o.date||todayStr(),priority:o.priority||"Fazer",startTime:o.startTime||"",endDate:o.endDate||"",endTime:o.endTime||""}));}
    return t;
  });
  const [habits,setHabits]=useState(()=>{const h=ld("d:habits",{_date:""});return h._date===todayStr()?h:{_date:todayStr()};});
  const [weekly,setWeekly]=useState(()=>ld("d:weekly",{}));
  const [notes,setNotes]=useState(()=>ld("d:notes",""));
  const [agendaDate,setAgendaDate]=useState(todayStr());
  const [showForm,setShowForm]=useState(false);
  const [editTask,setEditTask]=useState(null);
  const [showFilter,setShowFilter]=useState(false);
  const [filter,setFilter]=useState({text:"",cat:"",prio:"",status:"all"});

  // Pomodoro
  const [pomSecs,setPomSecs]=useState(25*60);
  const [pomMode,setPomMode]=useState("foco");
  const [pomRunning,setPomRunning]=useState(false);
  const [pomCount,setPomCount]=useState(()=>{const p=ld("d:pom",{count:0,date:""});return p.date===todayStr()?p.count:0;});
  const iRef=useRef(null),sRef=useRef(25*60),mRef=useRef("foco"),cRef=useRef(pomCount),rRef=useRef(false);

  const stopT=()=>{clearInterval(iRef.current);iRef.current=null;};
  const startT=()=>{
    stopT();
    iRef.current=setInterval(()=>{
      sRef.current-=1;setPomSecs(sRef.current);
      if(sRef.current<=0){
        stopT();rRef.current=false;setPomRunning(false);
        if(mRef.current==="foco"){cRef.current++;setPomCount(cRef.current);sv("d:pom",{count:cRef.current,date:todayStr()});mRef.current="pausa";setPomMode("pausa");sRef.current=5*60;setPomSecs(5*60);}
        else{mRef.current="foco";setPomMode("foco");sRef.current=25*60;setPomSecs(25*60);}
      }
    },1000);
  };
  const pomToggle=()=>{if(rRef.current){stopT();rRef.current=false;setPomRunning(false);}else{rRef.current=true;setPomRunning(true);startT();}};
  const pomReset=()=>{stopT();rRef.current=false;setPomRunning(false);mRef.current="foco";setPomMode("foco");sRef.current=25*60;setPomSecs(25*60);};
  useEffect(()=>()=>stopT(),[]);

  useEffect(()=>{
    const t1=setInterval(()=>setNow(new Date()),1000);
    const t2=setInterval(()=>setMIdx(i=>(i+1)%MISSIONS.length),9000);
    return()=>{clearInterval(t1);clearInterval(t2);};
  },[]);

  const saveTasks=t=>{setTasks(t);sv("d:tasks2",t);};
  const addTask=f=>{saveTasks([...tasks,{id:Date.now(),text:f.text.trim(),cat:f.cat,priority:f.priority,done:false,createdAt:new Date().toISOString(),startDate:f.startDate||todayStr(),startTime:f.startTime,endDate:f.endDate,endTime:f.endTime}]);setShowForm(false);};
  const updateTask=f=>{saveTasks(tasks.map(t=>t.id===editTask.id?{...t,text:f.text.trim(),cat:f.cat,priority:f.priority,startDate:f.startDate||todayStr(),startTime:f.startTime,endDate:f.endDate,endTime:f.endTime}:t));setEditTask(null);};
  const toggleTask=id=>saveTasks(tasks.map(t=>t.id===id?{...t,done:!t.done}:t));
  const deleteTask=id=>saveTasks(tasks.filter(t=>t.id!==id));
  const toggleHabit=hid=>{const u={...habits,[hid]:!habits[hid]};setHabits(u);sv("d:habits",u);const done=HABITS.filter(h=>u[h.id]).length;const wk={...weekly,[`${todayStr()}_${new Date().getDay()}`]:done};setWeekly(wk);sv("d:weekly",wk);};
  const logout=()=>{authClear();window.location.reload();};

  // Derivados
  const greeting=()=>{const h=now.getHours();return h<12?"Bom dia":h<18?"Boa tarde":"Boa noite";};
  const todayTasks=byPrio(tasks.filter(t=>(t.startDate||todayStr())===todayStr()));
  const doneToday=todayTasks.filter(t=>t.done).length;
  const doneHabits=HABITS.filter(h=>habits[h.id]).length;
  const habPct=Math.round((doneHabits/HABITS.length)*100);
  const taskPct=todayTasks.length?Math.round((doneToday/todayTasks.length)*100):0;
  const pomColor=pomMode==="foco"?"#6366f1":"#10B981";
  const pomPct=pomMode==="foco"?Math.round(((25*60-pomSecs)/(25*60))*100):Math.round(((5*60-pomSecs)/(5*60))*100);
  const overdueTasks=tasks.filter(t=>!t.done&&t.endDate&&new Date(`${t.endDate}T${t.endTime||"23:59"}`)<now);
  const urgentTasks=tasks.filter(t=>{if(t.done||!t.endDate)return false;const diff=(new Date(`${t.endDate}T${t.endTime||"23:59"}`)-now)/60000;return diff>=0&&diff<=120;});
  const navDate=d=>{const dt=new Date(agendaDate);dt.setDate(dt.getDate()+d);setAgendaDate(dt.toISOString().split("T")[0]);};
  const agendaTasks=byPrio(tasks.filter(t=>{
    if((t.startDate||todayStr())!==agendaDate)return false;
    if(filter.text&&!t.text.toLowerCase().includes(filter.text.toLowerCase()))return false;
    if(filter.cat&&t.cat!==filter.cat)return false;
    if(filter.prio&&t.priority!==filter.prio)return false;
    if(filter.status==="done"&&!t.done)return false;
    if(filter.status==="pending"&&t.done)return false;
    return true;
  }));
  const weekSummary=()=>{const d=new Date(),dow=d.getDay();return DAYS.map((name,i)=>{const dd=new Date(d);dd.setDate(d.getDate()-dow+i);return{name,count:weekly[`${dd.toISOString().split("T")[0]}_${i}`]||0,isToday:i===dow};});};
  const hasFilter=filter.text||filter.cat||filter.prio||filter.status!=="all";

  return(
    <div>
      {/* HEADER */}
      <div style={{background:"linear-gradient(135deg,#2D2F85,#5254c9)",borderRadius:"16px",padding:"20px 24px",marginBottom:"18px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <div>
          <div style={{fontSize:"20px",fontWeight:"500",color:"#fff"}}>{greeting()}, {NOME}</div>
          <div style={{fontSize:"12px",color:"rgba(255,255,255,0.7)",marginTop:"2px",textTransform:"capitalize"}}>
            {now.toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}
          </div>
          <div style={{fontSize:"11px",color:"rgba(255,255,255,0.5)",fontStyle:"italic",marginTop:"8px",maxWidth:"320px"}}>"{MISSIONS[mIdx]}"</div>
        </div>
        <div style={{textAlign:"right"}}>
          <div style={{fontFamily:"var(--mono)",fontSize:"28px",fontWeight:"500",color:"#fff",letterSpacing:"1px",marginBottom:"8px"}}>
            {now.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit",second:"2-digit"})}
          </div>
          <button onClick={logout} style={{fontSize:"11px",padding:"4px 12px",borderRadius:"8px",background:"rgba(255,255,255,0.15)",color:"rgba(255,255,255,0.9)",border:"none"}}>Sair</button>
        </div>
      </div>

      {/* METRICS */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(3,minmax(0,1fr))",gap:"12px",marginBottom:"18px"}}>
        {[
          {label:"Tarefas hoje",value:`${doneToday}/${todayTasks.length}`,pct:taskPct,color:"#6366f1"},
          {label:"Hábitos",value:`${doneHabits}/${HABITS.length}`,pct:habPct,color:"#10B981"},
          {label:"Pomodoros",value:`${pomCount} sessão${pomCount!==1?"ões":""}`,pct:pomPct,color:pomColor},
        ].map(m=>(
          <div key={m.label} style={{background:"var(--bg1)",border:"0.5px solid var(--b1)",borderRadius:"14px",padding:"14px 16px",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
            <div>
              <div style={{fontSize:"11px",color:"var(--t2)",marginBottom:"4px"}}>{m.label}</div>
              <div style={{fontSize:"20px",fontWeight:"500",color:"var(--t1)"}}>{m.value}</div>
            </div>
            <Ring pct={m.pct} color={m.color}/>
          </div>
        ))}
      </div>

      {/* ALERTAS */}
      {(overdueTasks.length>0||urgentTasks.length>0)&&(
        <div style={{display:"grid",gridTemplateColumns:`repeat(${(overdueTasks.length>0?1:0)+(urgentTasks.length>0?1:0)},minmax(0,1fr))`,gap:"12px",marginBottom:"18px"}}>
          {overdueTasks.length>0&&(
            <div style={{background:"#fee2e2",borderRadius:"14px",padding:"14px 16px",border:"0.5px solid #dc2626"}}>
              <div style={{fontSize:"13px",fontWeight:"500",color:"#dc2626",marginBottom:"8px"}}>Em atraso — {overdueTasks.length} tarefa{overdueTasks.length!==1?"s":""}</div>
              {overdueTasks.slice(0,4).map(t=>(
                <div key={t.id} style={{fontSize:"12px",color:"#7f1d1d",padding:"5px 0",borderBottom:"0.5px solid rgba(220,38,38,0.2)",display:"flex",justifyContent:"space-between",gap:"8px"}}>
                  <span style={{fontWeight:"500",flex:1}}>{t.text}</span>
                  <span style={{opacity:0.7,whiteSpace:"nowrap"}}>{fmtDate(t.endDate)}{t.endTime?` ${t.endTime}`:""}</span>
                </div>
              ))}
              {overdueTasks.length>4&&<div style={{fontSize:"11px",color:"#dc2626",marginTop:"6px"}}>+{overdueTasks.length-4} mais</div>}
            </div>
          )}
          {urgentTasks.length>0&&(
            <div style={{background:"#ffedd5",borderRadius:"14px",padding:"14px 16px",border:"0.5px solid #ea580c"}}>
              <div style={{fontSize:"13px",fontWeight:"500",color:"#ea580c",marginBottom:"8px"}}>Urgente — próximas 2h ({urgentTasks.length})</div>
              {urgentTasks.slice(0,4).map(t=>(
                <div key={t.id} style={{fontSize:"12px",color:"#7c2d12",padding:"5px 0",borderBottom:"0.5px solid rgba(234,88,12,0.2)",display:"flex",justifyContent:"space-between",gap:"8px"}}>
                  <span style={{fontWeight:"500",flex:1}}>{t.text}</span>
                  {t.endTime&&<span style={{opacity:0.7}}>até {t.endTime}</span>}
                </div>
              ))}
            </div>
          )}
        </div>
      )}

      {/* GRID PRINCIPAL */}
      <div style={{display:"grid",gridTemplateColumns:"minmax(0,1.55fr) minmax(0,1fr)",gap:"14px",marginBottom:"18px"}}>
        <div style={{display:"flex",flexDirection:"column",gap:"14px"}}>
          <SCard title="Tarefas do dia" accent="#6366f1" extra={<span style={{fontSize:"11px",color:"var(--t2)"}}>{doneToday}/{todayTasks.length} — clique no quadrado para concluir</span>}>
            <div style={{maxHeight:"280px",overflowY:"auto"}}>
              {todayTasks.length===0
                ?<div style={{fontSize:"13px",color:"var(--t3)",textAlign:"center",padding:"1.5rem 0"}}>Nenhuma tarefa para hoje</div>
                :todayTasks.map(t=><TaskRowCompact key={t.id} task={t} onToggle={toggleTask} onEdit={t=>{setEditTask(t);setShowForm(false);setAgendaDate(t.startDate||todayStr());window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"});}} onDelete={deleteTask}/>)
              }
            </div>
          </SCard>
          <SCard title="Notas rápidas" accent="#10B981">
            <textarea value={notes} onChange={e=>{setNotes(e.target.value);sv("d:notes",e.target.value);}} placeholder="Ideias, lembretes, rascunhos..."
              style={{width:"100%",minHeight:"90px",fontSize:"13px",border:"0.5px solid var(--b2)",borderRadius:"10px",padding:"10px 12px",background:"var(--bg2)",color:"var(--t1)",resize:"vertical",fontFamily:"var(--font)",boxSizing:"border-box",lineHeight:"1.6",outline:"none"}}/>
          </SCard>
        </div>
        <div style={{display:"flex",flexDirection:"column",gap:"14px"}}>
          <SCard title="Hábitos" accent="#10B981" extra={<span style={{fontSize:"11px",color:"var(--t2)"}}>{doneHabits}/{HABITS.length}</span>}>
            <div style={{display:"flex",flexDirection:"column",gap:"6px"}}>
              {HABITS.map(h=>{const done=!!habits[h.id];return(
                <div key={h.id} onClick={()=>toggleHabit(h.id)} style={{display:"flex",alignItems:"center",gap:"10px",padding:"8px 10px",borderRadius:"10px",cursor:"pointer",background:done?"#f0fdf7":"var(--bg2)",border:`0.5px solid ${done?"#10B981":"var(--b1)"}`,transition:"all 0.15s"}}>
                  <span style={{fontSize:"14px",lineHeight:1,flexShrink:0}}>{h.icon}</span>
                  <span style={{flex:1,fontSize:"13px",color:done?"#0a7a55":"var(--t1)",fontWeight:done?"500":"400",textDecoration:done?"line-through":"none",userSelect:"none"}}>{h.label}</span>
                  {done&&<span style={{fontSize:"11px",color:"#10B981",fontWeight:"500"}}>✓</span>}
                </div>
              );})}
            </div>
            <div style={{marginTop:"12px",background:"var(--bg2)",borderRadius:"8px",height:"6px",overflow:"hidden"}}>
              <div style={{height:"100%",width:`${habPct}%`,background:"#10B981",borderRadius:"8px",transition:"width 0.4s"}}/>
            </div>
          </SCard>
          <SCard title="Pomodoro" accent={pomColor}>
            <div style={{textAlign:"center",padding:"4px 0 6px"}}>
              <div style={{display:"inline-flex",alignItems:"center",justifyContent:"center",width:"88px",height:"88px",borderRadius:"50%",border:`4px solid ${pomColor}`,background:`${pomColor}15`,marginBottom:"10px",boxSizing:"border-box"}}>
                <div>
                  <div style={{fontFamily:"var(--mono)",fontSize:"21px",fontWeight:"500",color:pomColor,letterSpacing:"1px"}}>{fmt(pomSecs)}</div>
                  <div style={{fontSize:"9px",color:pomColor,textTransform:"uppercase",letterSpacing:"0.8px",marginTop:"1px"}}>{pomMode}</div>
                </div>
              </div>
              <div style={{display:"flex",gap:"8px",justifyContent:"center"}}>
                <button onClick={pomToggle} style={{padding:"7px 20px",fontSize:"13px",fontWeight:"500",borderRadius:"10px",background:pomRunning?"#fee2e2":"#6366f1",color:pomRunning?"#c94a1a":"#fff",border:"none"}}>{pomRunning?"Pausar":"Iniciar"}</button>
                <button onClick={pomReset} style={{padding:"7px 12px",fontSize:"13px",borderRadius:"10px",background:"var(--bg2)",color:"var(--t2)",border:"0.5px solid var(--b2)"}}>Reset</button>
              </div>
              <div style={{marginTop:"10px",display:"flex",justifyContent:"center",gap:"5px"}}>
                {Array.from({length:Math.min(pomCount,8)}).map((_,i)=><div key={i} style={{width:"7px",height:"7px",borderRadius:"50%",background:"#6366f1",opacity:0.7}}/>)}
                {pomCount===0&&<span style={{fontSize:"11px",color:"var(--t3)"}}>Nenhuma sessão</span>}
              </div>
            </div>
          </SCard>
          <SCard title="Semana" accent="#f59e0b">
            <div style={{display:"flex",gap:"4px",alignItems:"flex-end",height:"56px",padding:"0 2px"}}>
              {weekSummary().map((d,i)=>{const h=Math.max(d.count>0?(d.count/HABITS.length)*44:3,3);return(
                <div key={i} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:"5px",height:"100%",justifyContent:"flex-end"}}>
                  <div style={{width:"100%",borderRadius:"4px 4px 0 0",background:d.isToday?"#10B981":d.count>0?"#a7f3d0":"var(--b1)",height:`${h}px`,opacity:d.isToday?1:0.7,transition:"height 0.4s"}}/>
                  <div style={{fontSize:"9px",fontWeight:d.isToday?"500":"400",color:d.isToday?"var(--t1)":"var(--t3)"}}>{d.name}</div>
                </div>
              );})}
            </div>
          </SCard>
        </div>
      </div>

      {/* AGENDA */}
      <div style={{background:"var(--bg1)",border:"0.5px solid var(--b1)",borderRadius:"16px",overflow:"hidden"}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"12px 16px",borderBottom:"0.5px solid var(--b1)",background:"var(--bg2)",flexWrap:"wrap",gap:"8px"}}>
          <div style={{display:"flex",alignItems:"center",gap:"8px"}}>
            <div style={{width:"3px",height:"16px",borderRadius:"2px",background:"#f59e0b"}}/>
            <span style={{fontWeight:"500",fontSize:"14px",color:"var(--t1)"}}>Tarefas — Agenda</span>
          </div>
          <div style={{display:"flex",alignItems:"center",gap:"5px"}}>
            <button onClick={()=>navDate(-1)} style={{padding:"5px 10px",fontSize:"14px",borderRadius:"8px",border:"0.5px solid var(--b2)",background:"transparent",color:"var(--t1)"}}>‹</button>
            <button onClick={()=>setAgendaDate(todayStr())} style={{padding:"5px 10px",fontSize:"12px",fontWeight:"500",borderRadius:"8px",border:"0.5px solid var(--b2)",background:agendaDate===todayStr()?"#6366f1":"transparent",color:agendaDate===todayStr()?"#fff":"var(--t1)"}}>Hoje</button>
            <span style={{fontSize:"13px",fontWeight:"500",color:"var(--t1)",minWidth:"90px",textAlign:"center"}}>{fmtDate(agendaDate)}</span>
            <button onClick={()=>navDate(1)} style={{padding:"5px 10px",fontSize:"14px",borderRadius:"8px",border:"0.5px solid var(--b2)",background:"transparent",color:"var(--t1)"}}>›</button>
            <input type="date" value={agendaDate} onChange={e=>setAgendaDate(e.target.value)}
              style={{fontSize:"12px",padding:"5px 7px",borderRadius:"8px",border:"0.5px solid var(--b2)",background:"var(--bg2)",color:"var(--t1)"}}/>
          </div>
          <div style={{display:"flex",gap:"6px"}}>
            <button onClick={()=>setShowFilter(v=>!v)} style={{padding:"5px 12px",fontSize:"12px",borderRadius:"8px",border:`0.5px solid ${showFilter?"#6366f1":"var(--b2)"}`,background:showFilter?"#e0e7ff":"transparent",color:showFilter?"#6366f1":"var(--t2)"}}>
              {hasFilter?"Filtros ●":"Filtros"}
            </button>
            <button onClick={()=>{setShowForm(v=>!v);setEditTask(null);}}
              style={{padding:"5px 14px",fontSize:"12px",fontWeight:"500",borderRadius:"8px",background:showForm?"#fee2e2":"#6366f1",color:showForm?"#c94a1a":"#fff",border:"none"}}>
              {showForm?"× Fechar":"+ Nova tarefa"}
            </button>
          </div>
        </div>
        <div style={{padding:"14px 16px"}}>
          {showFilter&&(
            <div style={{background:"var(--bg2)",borderRadius:"12px",padding:"12px",marginBottom:"12px"}}>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr",gap:"8px"}}>
                <input value={filter.text} onChange={e=>setFilter(p=>({...p,text:e.target.value}))} placeholder="Buscar texto..." style={{...IS,gridColumn:"1/3"}}/>
                <select value={filter.cat} onChange={e=>setFilter(p=>({...p,cat:e.target.value}))} style={IS}>
                  <option value="">Todas categorias</option>
                  {Object.keys(CATS).map(c=><option key={c}>{c}</option>)}
                </select>
                <select value={filter.prio} onChange={e=>setFilter(p=>({...p,prio:e.target.value}))}
                  style={{...IS,background:filter.prio?PRIOS[filter.prio]?.bg:"var(--bg1)",color:filter.prio?PRIOS[filter.prio]?.color:"var(--t1)"}}>
                  <option value="">Todas prioridades</option>
                  {Object.keys(PRIOS).map(p=><option key={p}>{p}</option>)}
                </select>
                <select value={filter.status} onChange={e=>setFilter(p=>({...p,status:e.target.value}))} style={IS}>
                  <option value="all">Todos status</option>
                  <option value="pending">Pendente</option>
                  <option value="done">Concluída</option>
                </select>
              </div>
              {hasFilter&&<button onClick={()=>setFilter({text:"",cat:"",prio:"",status:"all"})}
                style={{marginTop:"8px",padding:"5px 12px",fontSize:"12px",borderRadius:"8px",background:"#fee2e2",color:"#dc2626",border:"none"}}>Limpar filtros</button>}
            </div>
          )}
          {showForm&&!editTask&&<TaskForm init={initF(agendaDate)} onSave={addTask} onCancel={()=>setShowForm(false)}/>}
          {editTask&&<TaskForm init={{text:editTask.text,cat:editTask.cat,priority:editTask.priority,startDate:editTask.startDate||"",startTime:editTask.startTime||"",endDate:editTask.endDate||"",endTime:editTask.endTime||""}} onSave={updateTask} onCancel={()=>setEditTask(null)}/>}
          <div style={{maxHeight:"400px",overflowY:"auto"}}>
            {agendaTasks.length===0
              ?<div style={{fontSize:"13px",color:"var(--t3)",textAlign:"center",padding:"2.5rem 0"}}>
                  Nenhuma tarefa para {fmtDate(agendaDate)}{hasFilter?" com esses filtros":""}
                </div>
              :agendaTasks.map(t=><TaskRow key={t.id} task={t} onToggle={toggleTask} onEdit={t=>{setEditTask(t);setShowForm(false);}} onDelete={deleteTask}/>)
            }
          </div>
          <div style={{marginTop:"10px",paddingTop:"10px",borderTop:"0.5px solid var(--b1)",display:"flex",gap:"16px",fontSize:"11px",color:"var(--t3)"}}>
            <span>{agendaTasks.length} tarefa{agendaTasks.length!==1?"s":""}</span>
            <span style={{color:"#10B981"}}>{agendaTasks.filter(t=>t.done).length} concluída{agendaTasks.filter(t=>t.done).length!==1?"s":""}</span>
            <span style={{color:"#ea580c"}}>{agendaTasks.filter(t=>!t.done).length} pendente{agendaTasks.filter(t=>!t.done).length!==1?"s":""}</span>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════
   ROOT — controla autenticação
   ═══════════════════════════════════════════ */
function Root(){
  const [auth,setAuth]=useState(authGet());
  return auth?<App/>:<Login onLogin={()=>setAuth(true)}/>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<Root/>);
</script>
</body>
</html>
